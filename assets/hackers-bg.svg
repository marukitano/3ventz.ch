<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#070312"/>
    <stop offset=".48" stop-color="#050914"/>
    <stop offset="1" stop-color="#020207"/>
  </linearGradient>
  <linearGradient id="magenta" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#ff16d6"/>
    <stop offset="1" stop-color="#6b00ff"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#00f7ff"/>
    <stop offset="1" stop-color="#006bff"/>
  </linearGradient>
  <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#070b14"/>
    <stop offset="1" stop-color="#020206"/>
  </linearGradient>
  <pattern id="windows" width="38" height="34" patternUnits="userSpaceOnUse">
    <rect width="38" height="34" fill="#07121b"/>
    <rect x="5" y="5" width="9" height="14" fill="#00d9ff" opacity=".25"/>
    <rect x="21" y="7" width="10" height="11" fill="#ff24ce" opacity=".18"/>
    <path d="M0 33H38M37 0V34" stroke="#0df" stroke-opacity=".08"/>
  </pattern>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0H0V26" fill="none" stroke="#00eaff" stroke-opacity=".11"/>
  </pattern>
  <filter id="glowC"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowM"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
</defs>

<rect width="1920" height="1080" fill="url(#night)"/>

<!-- neon haze -->
<ellipse cx="265" cy="315" rx="340" ry="270" fill="#00eaff" opacity=".11" filter="url(#soft)"/>
<ellipse cx="1665" cy="285" rx="390" ry="310" fill="#ff18d4" opacity=".13" filter="url(#soft)"/>
<ellipse cx="950" cy="970" rx="780" ry="160" fill="#ff007a" opacity=".12" filter="url(#soft)"/>

<!-- distant cyber city -->
<g opacity=".88">
  <path d="M0 95h105v70h72V58h98v121h68V28h89v160h83v-73h65v188H0z" fill="#080d18"/>
  <path d="M1920 70h-104v92h-77V36h-90v146h-91v-63h-68v190h430z" fill="#090b17"/>
  <rect x="0" y="110" width="420" height="690" fill="url(#windows)"/>
  <rect x="1500" y="95" width="420" height="720" fill="url(#windows)"/>
</g>

<!-- neon architectural lines -->
<g fill="none" stroke-linecap="square">
  <path d="M0 182H342L425 95" stroke="#00efff" stroke-width="4" opacity=".48" filter="url(#glowC)"/>
  <path d="M0 230H280L363 150" stroke="#ff1fd4" stroke-width="5" opacity=".48" filter="url(#glowM)"/>
  <path d="M1920 175H1580l-90-90" stroke="#ff22d4" stroke-width="5" opacity=".48" filter="url(#glowM)"/>
  <path d="M1920 228H1645l-95-82" stroke="#00efff" stroke-width="4" opacity=".48" filter="url(#glowC)"/>
</g>

<!-- left graffiti wall -->
<g transform="translate(32 58) rotate(-7 170 210)">
  <text x="0" y="56" font-family="Impact,Arial Black,sans-serif" font-size="54" fill="#ffe400" stroke="#ffe400" stroke-width="1" filter="url(#glowM)">HACK</text>
  <text x="8" y="112" font-family="Impact,Arial Black,sans-serif" font-size="51" fill="#ffe400">THE</text>
  <text x="-4" y="172" font-family="Impact,Arial Black,sans-serif" font-size="55" fill="#ffe400">PLANET</text>
  <path d="M2 190L245 135M18 202L220 160M12 43L232 14" stroke="#ff38d7" stroke-width="8" opacity=".7"/>
</g>

<!-- right graffiti wall -->
<g transform="translate(1610 62) rotate(5 140 180)">
  <text x="8" y="62" font-family="Impact,Arial Black,sans-serif" font-size="62" fill="#f8f8ff" stroke="#ff20d4" stroke-width="3">3VENTZ</text>
  <text x="34" y="126" font-family="Arial Black,sans-serif" font-size="26" fill="#ff32d8">PEOPLE</text>
  <text x="24" y="160" font-family="Arial Black,sans-serif" font-size="26" fill="#ff32d8">EVENTS</text>
  <text x="10" y="194" font-family="Arial Black,sans-serif" font-size="26" fill="#ff32d8">CONNECTIONS</text>
  <text x="18" y="228" font-family="Arial Black,sans-serif" font-size="26" fill="#ff32d8">A BRIGHTER 2026_</text>
</g>

<!-- eyepatch smiley on wall -->
<g transform="translate(1690 285) rotate(7)" filter="url(#glowM)">
  <circle cx="0" cy="0" r="62" fill="#ffe500" stroke="#111" stroke-width="5"/>
  <ellipse cx="-21" cy="-12" rx="20" ry="15" fill="#111"/>
  <path d="M-58 -28L47 -5" stroke="#111" stroke-width="7"/>
  <ellipse cx="24" cy="-10" rx="7" ry="10" fill="#111"/>
  <path d="M-33 24Q0 52 38 20" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
</g>

<!-- left human: punk hacker portrait silhouette -->
<g transform="translate(58 340)">
  <path d="M38 420C18 332 30 222 82 148C112 105 166 82 219 93C278 106 315 165 323 236C335 341 284 425 259 514H0z" fill="#080811" stroke="#00eaff" stroke-opacity=".24" stroke-width="4"/>
  <path d="M79 157C95 73 163 29 232 49C268 60 291 85 305 121C266 103 232 105 199 119C155 137 126 160 79 157z" fill="#171021"/>
  <path d="M112 117L139 61L150 121L178 44L185 117L222 52L223 121L260 78L248 138z" fill="#10101d" stroke="#ff22d4" stroke-opacity=".35"/>
  <ellipse cx="187" cy="183" rx="83" ry="103" fill="#16101c"/>
  <path d="M125 174Q150 150 178 165M201 165Q229 148 253 169" fill="none" stroke="#00efff" stroke-width="5" opacity=".75"/>
  <ellipse cx="157" cy="181" rx="9" ry="5" fill="#00efff"/>
  <ellipse cx="225" cy="180" rx="9" ry="5" fill="#ff2ad4"/>
  <path d="M160 231Q192 251 226 229" fill="none" stroke="#ff2ad4" stroke-width="5"/>
  <path d="M108 140Q187 94 277 145" fill="none" stroke="#00efff" stroke-width="5" opacity=".45"/>
  <circle cx="94" cy="144" r="30" fill="none" stroke="#ff2ad4" stroke-width="6"/>
  <circle cx="282" cy="146" r="28" fill="none" stroke="#00efff" stroke-width="6"/>
  <path d="M107 279L45 402L286 420L259 282Q187 333 107 279z" fill="#0b0a13"/>
  <path d="M80 326L304 260M56 370L280 313" stroke="#ff24ce" stroke-width="10" opacity=".25"/>
</g>

<!-- hooded figure behind left portrait -->
<g transform="translate(305 250)" opacity=".82">
  <path d="M45 288C35 178 52 84 128 32C207 68 228 176 211 289z" fill="#070812" stroke="#7028ff" stroke-width="4"/>
  <path d="M77 132Q128 81 180 132L170 211H85z" fill="#11101b"/>
  <circle cx="128" cy="171" r="38" fill="#090a10"/>
  <path d="M103 166h50M111 151l34 38M145 151l-34 38" stroke="#b4fff8" stroke-width="5" opacity=".6"/>
</g>

<!-- right human -->
<g transform="translate(1540 465)">
  <path d="M95 420C65 326 72 204 130 128C165 81 230 62 282 94C338 129 357 224 342 313C330 371 311 413 300 468H38z" fill="#070811" stroke="#ff2ad4" stroke-opacity=".25" stroke-width="4"/>
  <path d="M114 149C121 77 180 37 243 44C286 49 319 75 333 116C274 95 207 105 114 149z" fill="#16101f"/>
  <path d="M128 98L153 41L166 97L195 32L201 95L238 41L241 98L278 61L280 112z" fill="#100d18" stroke="#00efff" stroke-opacity=".28"/>
  <ellipse cx="223" cy="186" rx="77" ry="96" fill="#15101b"/>
  <rect x="150" y="151" width="68" height="27" rx="13" fill="#05050a" stroke="#00efff" stroke-width="5"/>
  <rect x="218" y="151" width="69" height="27" rx="13" fill="#05050a" stroke="#ff2ad4" stroke-width="5"/>
  <path d="M218 165H220" stroke="#eee" stroke-width="3"/>
  <path d="M196 228Q223 244 250 226" fill="none" stroke="#ff2ad4" stroke-width="4"/>
  <path d="M143 274L83 430L326 430L300 275Q224 326 143 274z" fill="#090914"/>
</g>

<!-- neon signs -->
<g font-family="monospace" font-weight="700">
  <g transform="translate(55 735) rotate(-2)">
    <rect width="270" height="185" rx="10" fill="#030a0c" stroke="#00ff8c" stroke-width="4"/>
    <text x="22" y="38" font-size="22" fill="#00ff8c">&gt; people</text>
    <text x="22" y="70" font-size="22" fill="#00ff8c">&gt; events</text>
    <text x="22" y="102" font-size="22" fill="#00ff8c">&gt; connections</text>
    <text x="22" y="134" font-size="22" fill="#00ff8c">&gt; hack_boredom</text>
    <text x="22" y="166" font-size="22" fill="#00ff8c">&gt; 3ventz://</text>
  </g>
  <g transform="translate(1630 565) rotate(-5)">
    <rect width="228" height="164" fill="#04100d" stroke="#39ff14" stroke-width="4"/>
    <text x="24" y="34" font-size="22" fill="#39ff14">&gt; HACK</text>
    <text x="24" y="64" font-size="22" fill="#39ff14">&gt; EXPLORE</text>
    <text x="24" y="94" font-size="22" fill="#39ff14">&gt; MEET</text>
    <text x="24" y="124" font-size="22" fill="#39ff14">&gt; CREATE</text>
    <text x="24" y="154" font-size="22" fill="#39ff14">&gt; REPEAT</text>
  </g>
</g>

<!-- yellow floppy -->
<g transform="translate(116 895) rotate(-8)">
  <path d="M0 0H142L178 36V184H0z" fill="#ffe400" stroke="#151000" stroke-width="6"/>
  <rect x="30" y="0" width="88" height="54" fill="#19150a"/>
  <rect x="46" y="12" width="37" height="31" fill="#b9ab27"/>
  <rect x="31" y="102" width="116" height="62" fill="#fff6a8" stroke="#161200" stroke-width="4"/>
  <text x="47" y="140" font-family="Impact,Arial Black,sans-serif" font-size="28" fill="#111">3VENTZ</text>
</g>

<!-- bottom wet neon street -->
<rect y="920" width="1920" height="160" fill="url(#street)"/>
<g opacity=".42" filter="url(#soft)">
  <path d="M0 955H1920" stroke="#ff15d2" stroke-width="28"/>
  <path d="M0 1000H1920" stroke="#00eaff" stroke-width="20"/>
</g>
<g opacity=".40">
  <path d="M0 947L1920 1034M0 1020L1920 958" stroke="#ff17d1" stroke-width="3"/>
  <path d="M220 920L85 1080M1680 920L1840 1080M720 920L620 1080M1210 920L1335 1080" stroke="#00eaff" stroke-width="4"/>
</g>

<!-- central dark quiet zone for UI -->
<rect x="360" y="55" width="1200" height="900" rx="24" fill="#02070b" opacity=".42"/>
<rect x="370" y="65" width="1180" height="880" rx="18" fill="url(#grid)" opacity=".17"/>
</svg>